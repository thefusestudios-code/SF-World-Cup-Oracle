// SCORING ENGINE — No need to edit below this line

function calculateResult(answers) {
  const scores = { Brazil:0, Argentina:0, France:0, Morocco:0, England:0, Germany:0, Spain:0, Portugal:0 };
  answers.forEach((idx, qIdx) => {
    const opt = QUESTIONS[qIdx] && QUESTIONS[qIdx].options[idx];
    if (opt) Object.entries(opt.scores).forEach(([c, p]) => { scores[c] = (scores[c]||0) + p; });
  });
  const max = Math.max(...Object.values(scores));
  const winners = Object.keys(scores).filter(c => scores[c] === max);
  if (winners.length === 1) return winners[0];
  const lastOpt = QUESTIONS[QUESTIONS.length-1].options[answers[answers.length-1]];
  if (lastOpt) for (const c of winners) if (lastOpt.scores[c]) return c;
  return winners[0];
}

          <div style={{background:"linear-gradient(160deg,#071a10 0%,#0b1628 55%,#0a0e1a 100%)",border:"2px solid #eab308",borderRadius:"20px",padding:"1.5rem",marginBottom:"0.875rem",position:"relative",overflow:"hidden",boxShadow:"0 8px 42px rgba(234,179,8,0.14)"}}>

            {/* decorative rings */}
            <div style={{position:"absolute",top:"-32px",right:"-32px",width:"120px",height:"120px",border:"2px solid rgba(234,179,8,0.09)",borderRadius:"50%",pointerEvents:"none"}}/>
            <div style={{position:"absolute",top:"-16px",right:"-16px",width:"75px",height:"75px",border:"2px solid rgba(234,179,8,0.11)",borderRadius:"50%",pointerEvents:"none"}}/>
            <div style={{position:"absolute",bottom:"-22px",left:"-22px",width:"90px",height:"90px",border:"2px solid rgba(21,128,61,0.09)",borderRadius:"50%",pointerEvents:"none"}}/>

            {/* header row */}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.1rem"}}>
              <div>
                <div style={{color:"#eab308",fontSize:"0.57rem",letterSpacing:"0.22em",fontWeight:800,textTransform:"uppercase"}}>Republic of Football</div>
                <div style={{color:"#4ade80",fontSize:"0.62rem",letterSpacing:"0.08em",marginTop:"1px"}}>Emergency Football Passport</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{color:"#374151",fontSize:"0.57rem"}}>Bureau of Football Destiny</div>
                <div style={{color:"#374151",fontSize:"0.57rem"}}>Naija Edition · 2026</div>
              </div>
            </div>

            {/* flag + country + archetype */}
            <div style={{textAlign:"center",marginBottom:"1.1rem",padding:"1rem 0.75rem",background:"rgba(0,0,0,0.35)",borderRadius:"14px",border:"1px solid rgba(234,179,8,0.11)"}}>
              <div style={{fontSize:"3.75rem",lineHeight:1,marginBottom:"0.3rem"}}>{C.flag}</div>
              <div style={{color:"white",fontSize:"1.75rem",fontWeight:900,letterSpacing:"0.04em",textTransform:"uppercase",marginBottom:"0.4rem"}}>{result}</div>
              <div style={{display:"inline-block",background:"#eab308",color:"#0a1628",fontSize:"0.7rem",fontWeight:800,padding:"3px 14px",borderRadius:"9999px",textTransform:"uppercase",letterSpacing:"0.1em"}}>{C.archetype}</div>
            </div>

            {/* data fields */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.6rem",marginBottom:"0.75rem"}}>
              {[
                {label:"Oracle Passport", value:result,        color:"#eab308"},
                {label:"Official Embassy",value:C.embassy,     color:"#4ade80"},
                {label:"Natural Rival",   value:C.rival,       color:"#f87171"},
                {label:"Passport Status", value:passportLabel, color:"#c084fc"},
              ].map((f,i) => (
                <div key={i} style={{background:"rgba(0,0,0,0.25)",borderRadius:"8px",padding:"0.6rem 0.7rem"}}>
                  <div style={{color:"#475569",fontSize:"0.56rem",letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:"2px"}}>{f.label}</div>
                  <div style={{color:f.color,fontSize:"0.74rem",fontWeight:700,lineHeight:1.35}}>{f.value}</div>
                </div>
              ))}
            </div>

            {/* objection status row */}
            {objection && (
              <div style={{display:"grid",gridTemplateColumns:objection==="dual"&&declaredFav?"1fr 1fr":"1fr",gap:"0.6rem",marginBottom:"0.75rem"}}>
                <div style={{background:"rgba(0,0,0,0.25)",borderRadius:"8px",padding:"0.6rem 0.7rem"}}>
                  <div style={{color:"#475569",fontSize:"0.56rem",letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:"2px"}}>Objection Status</div>
                  <div style={{color:"#fbbf24",fontSize:"0.74rem",fontWeight:700}}>{objectionStatus()}</div>
                </div>
                {objection==="dual" && declaredFav && (
                  <div style={{background:"rgba(0,0,0,0.25)",borderRadius:"8px",padding:"0.6rem 0.7rem"}}>
                    <div style={{color:"#475569",fontSize:"0.56rem",letterSpacing:"0.14em",textTransform:"uppercase",marginBottom:"2px"}}>Declared Favourite</div>
                    <div style={{color:"#c084fc",fontSize:"0.74rem",fontWeight:700}}>{declaredFav}</div>
                  </div>
                )}
              </div>
            )}

            {/* oracle stamp */}
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:"0.4rem"}}>
              <div style={{border:"2px solid rgba(234,179,8,0.32)",borderRadius:"6px",padding:"3px 8px",transform:"rotate(-7deg)"}}>
                <div style={{color:"#eab308",fontSize:"0.56rem",fontWeight:800,letterSpacing:"0.12em"}}>ORACLE CERTIFIED</div>
                <div style={{color:"#4b5563",fontSize:"0.5rem",textAlign:"center",letterSpacing:"0.08em"}}>2026 · NAIJA EDITION</div>
              </div>
            </div>
          </div>
          {/* ── END PASSPORT CARD ── */}

          {/* Oracle assessment */}
          <div style={{background:"#111827",borderRadius:"16px",padding:"1.2rem",marginBottom:"0.75rem",border:"1px solid #1e3a5f"}}>
            <div style={{color:"#eab308",fontSize:"0.6rem",letterSpacing:"0.18em",textTransform:"uppercase",fontWeight:700,marginBottom:"0.5rem"}}>Oracle Assessment</div>
            <p style={{color:"#94a3b8",fontSize:"0.875rem",lineHeight:1.7,margin:0}}>{C.longDesc}</p>
          </div>

          {/* Prophecy */}
          <div style={{background:"linear-gradient(135deg,#12253a,#0b1628)",borderRadius:"16px",padding:"1.2rem",marginBottom:"0.75rem",border:"1px solid rgba(234,179,8,0.38)"}}>
            <div style={{color:"#eab308",fontSize:"0.6rem",letterSpacing:"0.18em",textTransform:"uppercase",fontWeight:700,marginBottom:"0.5rem"}}>⚡ Your World Cup Prophecy</div>
            <p style={{color:"#f1f5f9",fontSize:"0.9rem",fontStyle:"italic",lineHeight:1.7,margin:0}}>"{C.prophecy}"</p>
          </div>

          {/* Natural rival */}
          <div style={{background:"#111827",borderRadius:"16px",padding:"1.1rem",marginBottom:"1.25rem",border:"1px solid #1e3a5f"}}>
            <div style={{color:"#f87171",fontSize:"0.6rem",letterSpacing:"0.18em",textTransform:"uppercase",fontWeight:700,marginBottom:"0.4rem"}}>⚔️ Natural Rival: {C.rival}</div>
            <p style={{color:"#6b7280",fontSize:"0.85rem",lineHeight:1.55,margin:0}}>{C.rivalNote}</p>
          </div>

          {/* ── OBJECTIONS ── */}
          <div style={{background:"#111827",borderRadius:"16px",padding:"1.25rem",marginBottom:"1rem",border:"1px solid #1e3a5f"}}>
            <div style={{color:"#a78bfa",fontSize:"0.6rem",letterSpacing:"0.18em",textTransform:"uppercase",fontWeight:700,marginBottom:"0.2rem"}}>Any Objections?</div>
            <p style={{color:"#4b5563",fontSize:"0.8rem",marginBottom:"1rem",fontStyle:"italic",lineHeight:1.55}}>
              "Your heart may argue. But your football soul has been documented."
            </p>
            <div style={{display:"flex",flexDirection:"column",gap:"0.5rem"}}>
              {[
                {key:"accepted",label:"✅  I accept my passport",         color:"#15803d"},
                {key:"dual",    label:"🛂  I accept dual citizenship",    color:"#7c3aed"},
                {key:"rejected",label:"❌  I reject this passport",       color:"#dc2626"},
                {key:"chaos",   label:"🌪️  I support chaos, not countries",color:"#f59e0b"},
              ].map(opt => (
                <button key={opt.key} onClick={()=>handleObjection(opt.key)}
                  style={{background:objection===opt.key?opt.color+"20":"transparent",border:`1.5px solid ${objection===opt.key?opt.color:"#1e3a5f"}`,borderRadius:"10px",padding:"0.75rem 1rem",color:objection===opt.key?"#f1f5f9":"#6b7280",textAlign:"left",cursor:"pointer",fontSize:"0.875rem",fontWeight:objection===opt.key?600:400,transition:"all 0.2s"}}>
                  {opt.label}
                </button>
              ))}
            </div>

            {/* dual citizenship input */}
            {objection==="dual" && showDual && (
              <div style={{marginTop:"1rem"}}>
                <label style={{color:"#d1d5db",fontSize:"0.8rem",display:"block",marginBottom:"0.5rem"}}>
                  Declare your favourite country (emotional):
                </label>
                <input type="text" value={declaredFav} onChange={e=>setDeclaredFav(e.target.value)}
                  placeholder="e.g. Senegal, Italy, Ghana, Brazil..."
                  style={{width:"100%",background:"#0b1628",border:"1.5px solid #7c3aed",borderRadius:"8px",padding:"0.75rem",color:"white",fontSize:"0.9rem",outline:"none"}}/>
                {declaredFav && (
                  <p style={{color:"#a78bfa",fontSize:"0.78rem",marginTop:"0.5rem",fontStyle:"italic",lineHeight:1.55}}>
                    Dual citizenship noted. Oracle Passport: <strong>{result}</strong>. Declared favourite: <strong>{declaredFav}</strong>. Competition identity remains {result}. The Oracle maintains jurisdiction.
                  </p>
                )}
              </div>
            )}

            {/* objection response */}
            {objection && (
              <div style={{marginTop:"1rem",padding:"0.75rem",background:"rgba(0,0,0,0.25)",borderRadius:"8px",borderLeft:"3px solid #4ade80"}}>
                <p style={{color:"#86efac",fontSize:"0.8rem",lineHeight:1.6,margin:0,fontStyle:"italic"}}>{objectionMsg()}</p>
              </div>
            )}
          </div>

          {/* ── CTAs ── */}
          <div style={{display:"flex",flexDirection:"column",gap:"0.75rem",marginBottom:"1rem"}}>
            <a href={WHATSAPP_LINK} target="_blank" rel="noopener noreferrer"
              style={{display:"block",background:"linear-gradient(135deg,#15803d,#16a34a)",color:"white",fontWeight:700,fontSize:"0.9375rem",padding:"1rem",borderRadius:"12px",textAlign:"center",boxShadow:"0 4px 22px rgba(21,128,61,0.32)"}}>
              💬 &nbsp;Join Your Embassy on WhatsApp
            </a>
            <a href={SUPERBRU_LINK} target="_blank" rel="noopener noreferrer"
              style={{display:"block",background:"linear-gradient(135deg,#1d4ed8,#2563eb)",color:"white",fontWeight:700,fontSize:"0.9375rem",padding:"1rem",borderRadius:"12px",textAlign:"center",boxShadow:"0 4px 22px rgba(29,78,216,0.3)"}}>
              🏆 &nbsp;Defend Your Embassy on Superbru
            </a>
            <button style={{background:"linear-gradient(135deg,#eab308,#f59e0b)",color:"#0a1628",fontWeight:800,fontSize:"0.9375rem",padding:"1rem",borderRadius:"12px",border:"none",cursor:"pointer",boxShadow:"0 4px 22px rgba(234,179,8,0.32)"}}>
              📸 &nbsp;Screenshot This Passport &amp; Post in the Group
            </button>
          </div>

          {/* Restart */}
          <div style={{textAlign:"center"}}>
            <button onClick={restart}
              style={{background:"transparent",border:"1.5px solid #1e3a5f",color:"#475569",padding:"0.7rem 2rem",borderRadius:"9999px",cursor:"pointer",fontSize:"0.875rem"}}>
              🔄 &nbsp;Restart — Try Another Passport
            </button>
          </div>

        </div>
      </div>
    );
  }

  return null;
}

// ── MOUNT ──────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
