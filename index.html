function share(){const r=RESULTS[winner];const msg=`The World Cup Oracle has stamped me: ${r.flag} ${winner} — ${r.persona}. Passport No: ${r.passportCode}`+(dual?` Declared Favourite: ${dual}.`:'.');if(navigator.share){navigator.share({title:'My World Cup Oracle Passport',text:msg}).catch(()=>{});}else{navigator.clipboard.writeText(msg);setCopied(true)}}
const Shell=({children,cls=''})=><div className="app"><div className="blob b1"/><div className="blob b2"/><div className="blob b3"/><div className={'screen '+cls}>{children}</div></div>;
if(screen==='landing')return <Shell cls="landing"><img onClick={()=>setScreen('question')} className="hero" src="Savvy Oracle.png" alt="The World Cup Oracle Passport"/><button onClick={()=>setScreen('question')} className="landingBtn">ASSIGN MY PASSPORT →</button></Shell>;
if(screen==='question'){const qu=questions[idx];return <Shell><div className="progressLabel">PASSPORT APPLICATION {idx+1}/6</div><div className="progressTrack"><div className="progressFill" style={{width:`${((idx+1)/6)*100}%`}} /></div><div className="questionCard"><div className="ministry">MINISTRY QUESTION</div><h1 className="questionText">{qu.text}</h1><div className="options">{qu.shown.map((o,i)=><button className="option" key={i} onClick={()=>answer(o.country)}>{o.text}</button>)}</div></div></Shell>}
if(screen==='calculating')return <Shell cls="calc"><div className="spinner"/><h2>THE MINISTRY IS STAMPING...</h2><p className="small">Do not refresh. Your football soul is under review.</p></Shell>;
if(screen==='tie')return <Shell cls="tie"><div className="questionCard"><div className="ministry">MINISTRY QUESTION</div><div className="tieCopy">Your answers are giving signals that are confusing the Oracle. The Ministry requires one final answer. Choose carefully.</div><h1 className="questionText">{tieQ.text}</h1><div className="options">{tieQ.options.filter(o=>tied.includes(o.country)).map((o,i)=><button className="option" key={i} onClick={()=>{setWinner(o.country);setScreen('result')}}>{o.text}</button>)}</div></div></Shell>;
if(screen==='result'){const r=RESULTS[winner];return <Shell><div className="resultCard"><div className="resultTop">Emergency Football Passport</div><div className="spoken">THE ORACLE HAS SPOKEN...</div><div className="claimed"><span className="flag">{r.flag}</span><span>{winner.toUpperCase()} HAS CLAIMED YOU</span></div><img className="stamp" src={r.stampSrc} alt={`${winner} passport stamp`}/><div className="persona">{r.persona}</div><div className="passCode">Passport No: {r.passportCode}</div>{dual&&<div className="declared">Declared Favourite: {dual}</div>}<p className="description">{r.description}</p><div className="labelRow"><div className="beefLabel">Embassy Beef:</div><div className="beefBox"><div className="beefCountry">{r.rival}</div><div className="beefLine">{r.beefLine}</div></div></div></div>{!accepted&&<><div className="actions"><button className="btn green" onClick={()=>setAccepted(true)}>✓ ACCEPT PASSPORT</button><button className="btn red" onClick={reset}>✕ APPEAL RESULT</button></div><button className="textLink" onClick={()=>setShowDual(!showDual)}>↔ ADD DUAL CITIZENSHIP</button>{showDual&&<select className="select" value={dual} onChange={e=>{setDual(e.target.value); if(e.target.value)setAccepted(true)}}><option value="">Choose emotional favourite</option>{ALL_48.map(c=><option key={c}>{c}</option>)}</select>}</>}{accepted&&<div className="ctaPanel"><button className="btn deep" onClick={()=>window.open(WHATSAPP_LINKS[winner],'_blank')}>JOIN MY {winner.toUpperCase()} EMBASSY WHATSAPP</button><button className="btn yellow" onClick={()=>window.open(TOURNAMENT_LINK,'_blank')}>JOIN TOURNAMENT CHALLENGE</button><button className="btn deep" onClick={share}>SHARE MY PASSPORT</button>{copied&&<div className="copyNote">Share copy copied to clipboard.</div>}<button className="textLink" onClick={reset}>Retake the Test</button></div>}</Shell>}
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
