function calculateResult(answers) {
  const scores = {}, latest = {};
  answers.forEach((c, i) => { scores[c] = (scores[c] || 0) + 1; latest[c] = i; });
  const top = Math.max(...Object.values(scores));
  const tied = Object.keys(scores).filter(c => scores[c] === top);
  return tied.length === 1 ? tied[0] : tied.sort((a, b) => latest[b] - latest[a])[0];
}

function App() {
  const [screen, setScreen] = useState("landing");
  const [questions, setQuestions] = useState([]);
  const [currentQ, setCurrentQ] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [result, setResult] = useState(null);

  const startQuiz = useCallback(() => {
    const qs = selectQuestions();
    setQuestions(qs);
    setCurrentQ(0);
    setAnswers([]);
    setResult(null);
    setScreen("quiz");
  }, []);

  const handleAnswer = useCallback((country) => {
    const newAnswers = [...answers, country];
    setAnswers(newAnswers);
    if (currentQ < questions.length - 1) {
      setCurrentQ(q => q + 1);
    } else {
      setScreen("calculating");
      setTimeout(() => {
        setResult(calculateResult(newAnswers));
        setScreen("result");
      }, 2200);
    }
  }, [answers, currentQ, questions.length]);

  const handleRetake = useCallback(() => { setScreen("landing"); }, []);

  return React.createElement("div", { className:"app-container" },
    screen === "landing" && React.createElement(LandingScreen, { onStart: startQuiz }),
    screen === "quiz" && questions.length > 0 && React.createElement(QuizScreen, { questions, currentQ, onAnswer: handleAnswer }),
    screen === "calculating" && React.createElement(CalculatingScreen),
    screen === "result" && result && React.createElement(ResultScreen, { result, onRetake: handleRetake })
  );
}
