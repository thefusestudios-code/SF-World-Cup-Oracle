      --green-dark: #556B2F;
      --green-light: #8FBC3A;
      --navy: #1a1a2e;
      --navy-light: #16213e;
      --white: #ffffff;
      --off-white: #f5f5f0;
      --yellow: #F5C518;
      --yellow-dark: #D4A017;
      --red: #C0392B;
      --grey-light: #e8e8e0;
      --stamp-bg: #f0eed8;
      --font-heading: 'Bebas Neue', sans-serif;
      --font-body: 'Montserrat', sans-serif;

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* ===================== SHARED ===================== */

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Decorative blobs */

      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      pointer-events: none;
    }
    .blob-1 { width: 200px; height: 200px; background: #9b59b6; top: -60px; right: -60px; }
    .blob-2 { width: 150px; height: 150px; background: #9b59b6; bottom: 120px; left: -50px; }

      text-align: center;
      padding: 40px 24px 32px;
      justify-content: center;
      align-items: center;
    }

    .landing-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
    }

    .landing-badge {
      display: inline-block;
      background: var(--green);
      color: var(--white);
      font-family: var(--font-heading);
      font-size: 0.7rem;
      letter-spacing: 2px;
      padding: 4px 14px;
      border-radius: 3px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .landing h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      line-height: 1.1;
      color: var(--white);
      margin-bottom: 4px;
    }
    .landing h1 span {
      color: var(--yellow);
    }

    .landing-subtitle {
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.5;
      margin: 12px 0 20px;
      max-width: 320px;
    }

    .flag-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .flag-chip {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 6px 12px;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .flag-chip .fi { font-size: 1rem; }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--yellow);
      color: var(--navy);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.05rem;
      padding: 16px 48px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: none;
      width: 100%;
      max-width: 320px;
    }
    .cta-btn:hover { background: var(--yellow-dark); transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }

    .landing-footer {
      font-size: 0.65rem;
      color: #666;
      margin-top: 16px;
      font-style: italic;
    }

      color: var(--navy);
      padding: 0;

      padding: 16px 20px 12px;
      text-align: center;
      border-bottom: 1px solid var(--grey-light);

      height: 28px;

      font-size: 1.1rem;
      letter-spacing: 1.5px;
      color: var(--green-dark);
      text-transform: uppercase;
    }

      height: 6px;
      background: var(--grey-light);
    }
    .q-progress-fill {

      background: linear-gradient(90deg, var(--green), var(--green-light));
      transition: width 0.4s ease;

      padding: 20px 18px 24px;
      flex: 1;
    }

      border: 2px solid var(--green);
      border-radius: 16px;
      padding: 24px 18px;
      position: relative;
    }

      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 8px;

      font-size: 1.55rem;
      line-height: 1.15;
      color: var(--navy);
      margin-bottom: 18px;

      font-size: 0.95rem;

      border: none;

      color: var(--navy);

      background: var(--white);
      color: var(--red);

      color: var(--green-dark);

      color: var(--white);

    .btn-superbru {

      color: var(--white);

    .btn-share {
      background: var(--navy);
      color: var(--white);

    .btn-download {
      background: var(--yellow);
      color: var(--navy);

    .results-footer {
      text-align: center;
      font-size: 0.6rem;
      color: #999;
      padding: 16px;
      line-height: 1.5;
    }

      height: 1px;
      background: #ddd;
      margin: 16px 0;

      font-family: var(--font-heading);
      font-size: 1.1rem;
      color: var(--navy);
      text-align: center;
      margin-bottom: 12px;
    }
    .dual-grid {

      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dual-option {
      background: var(--white);
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .dual-option:hover, .dual-option.active {
      border-color: var(--green);
      background: rgba(107, 142, 35, 0.08);
    }
    .dual-option .dual-flag { font-size: 1.5rem; margin-bottom: 4px; }

      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--navy);

      display: inline-block;
      background: var(--green);
      color: var(--white);
      font-size: 0.55rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Fade-in animation */
    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Slide up animation */
    .slide-up {
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Screenshot hint */
    .screenshot-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--green-dark);
      font-weight: 500;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: rgba(107, 142, 35, 0.08);
      border-radius: 8px;
    }

    /* Accepted state */
    .accepted-actions {
      margin-top: 8px;
    }

    /* Country flag emoji fallback display */
    .country-flag {
      display: inline-block;
      font-size: 1.2rem;
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>

      const scores = tallyScores(answers);
      // Find max score
      const maxScore = Math.max(...Object.values(scores));
      const topCountries = COUNTRY_KEYS.filter(k => scores[k] === maxScore);

      if (topCountries.length === 1) return topCountries[0];

      // Tie: use tie-breaker answer (last answer)
      const tbAnswer = answers[answers.length - 1];
      if (tbAnswer && topCountries.includes(tbAnswer.country)) {
        return tbAnswer.country;
      }

      // If tie-breaker didn't resolve, use wildcard answer (second to last)
      const wcAnswer = answers[answers.length - 2];
      if (wcAnswer && topCountries.includes(wcAnswer.country)) {
        return wcAnswer.country;
      }

      // Final fallback: random among tied
      return topCountries[Math.floor(Math.random() * topCountries.length)];
    }

    // =============================================
    //  COMPONENTS
    // =============================================

    // --- Landing Page ---
    function LandingPage({ onStart }) {
      return (
        <div className="page landing fade-in">
          <div className="blob blob-1"></div>
          <div className="blob blob-2"></div>
          <div className="blob blob-3"></div>

          <div style={{ fontSize: "3rem", marginBottom: 8 }}>🏆</div>

          <div className="landing-badge">World Cup 2026 — Official Oracle</div>

          <h1>
            The Savvy Football<br />
            <span>World Cup Oracle</span>
          </h1>

          <p className="landing-subtitle">
            Nigeria didn't qualify.<br />
            So we're issuing emergency football passports.<br />
            Find out which country owns your football soul.
          </p>

          <div className="flag-row">
            {COUNTRY_KEYS.map(k => (
              <div className="flag-chip" key={k}>
                <span>{COUNTRIES[k].flag}</span>
                <span>{COUNTRIES[k].code}</span>
              </div>
            ))}
          </div>

          <button className="cta-btn" onClick={onStart}>
            Take the Oracle →
          </button>

          <div className="landing-footer">
            Ministry of Football Vibes — Emergency Passport Office
          </div>
        </div>
      );
    }

    // --- Question Page ---
    function QuestionPage({ questions, currentIndex, selectedAnswer, onSelect, onNext }) {
      const q = questions[currentIndex];
      const total = questions.length;
      const progress = ((currentIndex) / total) * 100;
      const progressAfter = ((currentIndex + (selectedAnswer ? 1 : 0)) / total) * 100;

      // Determine question type label
      let typeLabel = "Ministry Question";
      if (q.isWildcard) typeLabel = "Wildcard Question";
      if (q.isTiebreaker) typeLabel = "Tie-Breaker";

      return (
        <div className="page question-page fade-in" key={currentIndex}>
          <div className="blob blob-1"></div>
          <div className="blob blob-2"></div>

          <div className="q-header">
            <div className="q-header-icon">✈️</div>
            <div className="q-label">Passport Application {currentIndex + 1}/{total}</div>
          </div>

          <div className="q-progress">
            <div className="q-progress-fill" style={{ width: `${progressAfter}%` }}></div>
          </div>

          <div className="q-body">
            <div className="q-card slide-up">
              <div className="q-card-label">{typeLabel}</div>
              <h2>{q.question}</h2>

              <div className="q-options">
                {q.options.map((opt, i) => (
                  <button
                    key={i}
                    className={`q-option ${selectedAnswer && selectedAnswer.country === opt.country && selectedAnswer.text === opt.text ? 'selected' : ''}`}
                    onClick={() => onSelect(opt)}
                  >
                    {opt.text}
                  </button>
                ))}
              </div>

              <button
                className="q-next-btn"
                disabled={!selectedAnswer}
                onClick={onNext}
              >
                {currentIndex < total - 1 ? "Next Question" : "Stamp My Passport"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Results Page ---
    function ResultsPage({ winner, answers, onRestart }) {
      const [accepted, setAccepted] = useState(false);
      const [showDualPicker, setShowDualPicker] = useState(false);
      const [dualCountry, setDualCountry] = useState(null);

      const country = COUNTRIES[winner];
      const rival = COUNTRIES[country.rival];

      const handleAccept = () => setAccepted(true);
      const handleAppeal = () => onRestart();
      const handleDualCitizenship = () => setShowDualPicker(true);
      const handleSelectDual = (key) => {
        setDualCountry(key);
        setShowDualPicker(false);
      };

      const handleShare = async () => {
        const shareText = `🏆 The World Cup Oracle has spoken!\n\n${country.flag} ${country.name} has claimed me.\nArchetype: ${country.archetype}\n\nGet your emergency football passport: ${window.location.href}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: "World Cup Oracle Result", text: shareText });
          } catch(e) {}
        } else {
          navigator.clipboard?.writeText(shareText);
          alert("Result copied to clipboard!");
        }
      };

      return (
        <div className="page results-page fade-in">
          {/* Banner */}
          <div className="results-oracle-banner">
            <h2>
              <span className="r1">T</span><span className="r2">H</span><span className="r3">E </span>
              <span className="r4">O</span><span className="r5">R</span><span className="r6">A</span>
              <span className="r1">C</span><span className="r2">L</span><span className="r3">E </span>
              <span className="r4">H</span><span className="r5">A</span><span className="r6">S </span>
              <span className="r1">S</span><span className="r2">P</span><span className="r3">O</span>
              <span className="r4">K</span><span className="r5">E</span><span className="r6">N.</span>
            </h2>
          </div>

          <div className="results-body">
            {/* Passport Card */}
            <div className="passport-card slide-up">
              <div className="passport-card-header">
                <span>Emergency Football Passport</span>
                <span className="edition">2026 Edition</span>
              </div>

              <div className="passport-card-body">
                <img
                  src={country.stampImage}
                  alt={`${country.name} stamp`}
                  className="passport-stamp-mini"
                />
                <div className="passport-info">
                  <div className="nation-label">Assigned Nation</div>
                  <div className="nation-name">{country.flag} {country.name}</div>
                  <div className="archetype">{country.archetype}</div>
                  <div className="rival-label">Natural Rival</div>
                  <div className="rival-name">{rival.flag} {rival.name}</div>
                </div>
              </div>

              <div className="passport-description">
                {country.description}
              </div>
            </div>

            {/* Dual citizenship display */}
            {dualCountry && (
              <div className="passport-card slide-up" style={{ borderColor: "var(--green)", borderStyle: "dashed" }}>
                <div className="passport-card-header" style={{ background: "var(--green-dark)" }}>
                  <span>Dual Citizenship</span>
                  <span className="edition">Secondary</span>
                </div>
                <div className="passport-card-body">
                  <img
                    src={COUNTRIES[dualCountry].stampImage}
                    alt={`${COUNTRIES[dualCountry].name} stamp`}
                    className="passport-stamp-mini"
                  />
                  <div className="passport-info">
                    <div className="nation-label">Secondary Nation</div>
                    <div className="nation-name">{COUNTRIES[dualCountry].flag} {COUNTRIES[dualCountry].name}</div>
                    <div className="archetype">{COUNTRIES[dualCountry].archetype}</div>
                  </div>
                </div>
              </div>
            )}

            {/* Ministry note */}
            <div className="passport-stamped-note">
              The Ministry has stamped your emergency passport. You may accept the result or object loudly like a proper football fan.
            </div>

            {/* Primary action buttons */}
            {!accepted ? (
              <>
                <button className="action-btn btn-accept" onClick={handleAccept}>
                  Accept My Passport ✓
                </button>
                <button className="action-btn btn-object" onClick={handleAppeal}>
                  I Object To This Result
                </button>
              </>
            ) : (
              <div className="accepted-actions slide-up">
                <div className="screenshot-hint">
                  📸 Passport stamped. Screenshot this passport before sharing.<br/>
                  Evidence may be required in the group chat.
                </div>

                <button className="action-btn btn-share" onClick={handleShare}>
                  📤 Share My Passport
                </button>

                <a href={country.whatsappLink} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                  <button className="action-btn btn-whatsapp">
                    💬 Join My Embassy WhatsApp Group
                  </button>
                </a>

                <a href={country.superbruLink} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                  <button className="action-btn btn-superbru">
                    ⚽ Join Tournament Challenge
                  </button>
                </a>

                <div className="divider"></div>

                {!dualCountry && !showDualPicker && (
                  <button className="action-btn btn-dual" onClick={handleDualCitizenship}>
                    ↔ Add Dual Citizenship
                  </button>
                )}

                <button className="action-btn btn-object" onClick={handleAppeal} style={{ marginTop: 4 }}>
                  🔄 Retake the Oracle
                </button>
              </div>
            )}

            {/* Dual Citizenship Picker */}
            {showDualPicker && (
              <div className="dual-picker slide-up">
                <h3>Choose Your Second Country</h3>
                <div className="dual-grid">
                  {COUNTRY_KEYS.filter(k => k !== winner).map(k => (
                    <button
                      key={k}
                      className="dual-option"
                      onClick={() => handleSelectDual(k)}
                    >
                      <div className="dual-flag">{COUNTRIES[k].flag}</div>
                      <div className="dual-name">{COUNTRIES[k].name}</div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="results-footer">
              Ministry of Football Vibes — Emergency Passport Office · Savvy Football 2026
            </div>
          </div>
        </div>
      );
    }

    // =============================================
    //  MAIN APP
    // =============================================
    function App() {
      const [screen, setScreen] = useState("landing"); // landing | quiz | results
      const [questions, setQuestions] = useState([]);
      const [currentQ, setCurrentQ] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [winner, setWinner] = useState(null);

      const handleStart = () => {
        const quiz = buildQuiz();
        setQuestions(quiz);
        setCurrentQ(0);
        setAnswers([]);
        setSelectedAnswer(null);
        setWinner(null);
        setScreen("quiz");
        window.scrollTo(0, 0);
      };

      const handleSelect = (option) => {
        setSelectedAnswer(option);
      };

      const handleNext = () => {
        const newAnswers = [...answers, selectedAnswer];
        setAnswers(newAnswers);
        setSelectedAnswer(null);

        if (currentQ < questions.length - 1) {
          setCurrentQ(currentQ + 1);
          window.scrollTo(0, 0);
        } else {
          // Quiz done — determine winner
          const result = determineWinner(newAnswers);
          setWinner(result);
          setScreen("results");
          window.scrollTo(0, 0);
        }
      };

      const handleRestart = () => {
        handleStart();
      };

      if (screen === "landing") {
        return <LandingPage onStart={handleStart} />;
      }

      if (screen === "quiz") {
        return (
          <QuestionPage
            questions={questions}
            currentIndex={currentQ}
            selectedAnswer={selectedAnswer}
            onSelect={handleSelect}
            onNext={handleNext}
          />
        );
      }

      if (screen === "results") {
        return (
          <ResultsPage
            winner={winner}
            answers={answers}
            onRestart={handleRestart}
          />
        );
      }

      return null;
    }

    // Mount
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
