        .btn {
            display: block; width: 90%; margin: 10px auto; padding: 16px;
            border: none; border-radius: 12px; font-family: 'Bebas Neue', cursive;
            font-size: 24px; cursor: pointer; transition: transform 0.1s;
            text-align: center; letter-spacing: 1px;

        .btn-green { background: #25D366; color: #fff; }

        .p-label:first-child { margin-top: 0; }
        .p-value { font-family: 'Bebas Neue', cursive; font-size: 26px; color: #000; line-height: 1; }
        .p-persona { font-size: 13px; font-weight: 800; color: var(--green); margin-top: 2px; }

// ============================================================
// HELPERS
// ============================================================
function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function buildQuizSet() {
  const slots = [POOL.s1, POOL.s2, POOL.s3, POOL.s4, POOL.s5, POOL.s6];
  const questions = slots.map(slot => {
    const variant = pickRandom(slot);
    // Shuffle and pick 4 options
    const shuffled = [...variant.opts].sort(() => 0.5 - Math.random()).slice(0, 4);
    return { q: variant.q, opts: shuffled };
  });
  return questions;
}

function calcResult(scores) {
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) return { winner: null, tie: false };
  const top = sorted[0][1];
  const tied = sorted.filter(s => s[1] === top);
  return { winner: sorted[0][0], tie: tied.length > 1 };
}

// APP
// ============================================================

  const [objected, setObjected] = useState(false);

    setQuestions(buildQuizSet());
    setQIndex(0);
    setScores({});
    setResult(null);
    setAccepted(false);
    setObjected(false);
    setScreen('quiz');
  }

  function handleAnswer(country) {
    const pts = qIndex === 0 ? 2 : 1; // Q1 weighted
    const newScores = { ...scores, [country]: (scores[country] || 0) + pts };
    setScores(newScores);
    if (qIndex < 5) {
      setQIndex(qIndex + 1);
    } else {
      setScreen('calculating');
      setTimeout(() => {
        const { winner, tie } = calcResult(newScores);
        if (tie) {
          setScreen('tiebreaker');
        } else {
          setResult(winner);
          setScreen('result');
        }
      }, 1600);
    }
  }

  function handleTieBreaker(country) {
    setResult(country);
    setScreen('result');
  }

    }

            <button key={i} className="opt-btn" onClick={() => handleAnswer(o.c)}>{o.t}</button>

        </div>
      </div></div>
    );

  if (screen === 'calculating') return (
    <div className="app"><div className="shell loading-screen">

      <div className="app"><div className="shell">
        <div className="tiebreaker-wrap">
          <span className="tb-badge">⚠️ Notice from the Ministry</span>

            <button key={i} className="opt-btn" onClick={() => handleTieBreaker(o.c)}>{o.t}</button>
          ))}
        </div>
      </div></div>
    );
  }

  // ---- RESULT ----
  if (screen === 'result') {

        <div className="result-wrap">

              <span className="passport-header-year">2026 Edition</span>

              <img src={`stamp-${result.toLowerCase()}.png`} className="stamp-img" alt={result} />
              <div className="passport-info">
                <p className="p-label">Assigned Nation</p>

            <div className="panel">

          {accepted && (
            <div className="panel">
              <p className="panel-title">Official Document Issued.</p>
              <p className="panel-sub">Join your embassy. Screenshot this passport. Evidence will be required in the group chat.</p>
              <button className="btn btn-green" onClick={() => window.open(WHATSAPP_LINK, '_blank')}>Join My Embassy WhatsApp</button>

              <button className="btn btn-share" onClick={shareResult}>Share My Passport</button>
              <button className="btn btn-outline" onClick={startQuiz} style={{marginTop:'8px', fontSize:'16px'}}>Retake Test</button>
            </div>
          )}

          <p className="footer-note">Ministry of Football Vibes — Emergency Passport Office · Savvy Football 2026</p>
        </div>
      </div></div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
