function getStoredAttribution(){
  const key='oracle_attribution_v1';
  try{
    const existing=JSON.parse(localStorage.getItem(key)||'null');
    const params=new URLSearchParams(window.location.search);
    const incoming={

      utm_medium:params.get('utm_medium')||'',

      const saved={
        ...incoming,
        referrer:document.referrer||'',
        landing_url:window.location.href,
        first_seen_at:new Date().toISOString()
      };
      localStorage.setItem(key,JSON.stringify(saved));
      return saved;

    if(hasIncoming && !(existing.utm_source||existing.utm_medium||existing.utm_campaign)){
      const merged={...existing,...incoming};

      return merged;
    }
    return existing;

}

function logCompletionToSheet(payload){

const flagFor = c => COUNTRY_FLAGS[c] || '🏳️';
const shuffle = a => { const x=[...a]; for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; } return x; };
function balancedMatrix(){
  const counts=Object.fromEntries(COUNTRIES.map(c=>[c,3]));
  const rows=[];
  function fill(r){
    if(r===6) return true;
    let candidates=shuffle(COUNTRIES.filter(c=>counts[c]>0));
    function combo(start,pick){
      if(pick.length===4){
        pick.forEach(c=>counts[c]--);
        rows[r]=shuffle(pick);
        if(fill(r+1)) return true;
        pick.forEach(c=>counts[c]++);
        return false;
      }
      for(let i=start;i<candidates.length;i++){
        if(counts[candidates[i]]>0 && combo(i+1,[...pick,candidates[i]])) return true;
      }
      return false;
    }
    return combo(0,[]);
  }
  fill(0);
  return rows;
}
function makeSession(){
  const selected=QUESTION_BANK.map(slot=>slot[Math.floor(Math.random()*slot.length)]);
  const matrix=balancedMatrix();
  return selected.map((question,i)=>({
    ...question,
    shown: shuffle(matrix[i].map(c=>question.options.find(o=>o.country===c)).filter(Boolean))
  }));
}

let screen='landing';

let scores=Object.fromEntries(COUNTRIES.map(c=>[c,0]));
let winner=null;
let tied=[];
let tieQ=null;
let accepted=false;
let dual='';
let showAppeal=false;

const root=document.getElementById('root');

const shell=(content,cls='')=>`<div class="app"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="screen ${cls}">${content}</div></div>`;
function setScreen(next){ screen=next; render(); }
function setState(updates){ Object.assign(window.__oracleState||{}, updates); render(); }
function reset(){
  trackEvent('retake_click',{assigned_country:winner||''});
  questions=makeSession(); idx=0; scores=Object.fromEntries(COUNTRIES.map(c=>[c,0])); winner=null; tied=[]; tieQ=null; accepted=false; dual=''; showAppeal=false; dualMode=false; copied=false; screen='question'; render();
}
function answer(country){
  scores={...scores,[country]:(scores[country]||0)+1};
  if(idx<5){ idx++; render(); return; }
  screen='calculating'; render(); setTimeout(()=>finish(scores),600);
}
function finish(ns){
  const max=Math.max(...COUNTRIES.map(c=>ns[c]||0));
  const tops=COUNTRIES.filter(c=>(ns[c]||0)===max);
  if(tops.length>1){ tied=tops; tieQ=TIE_BREAKERS[Math.floor(Math.random()*TIE_BREAKERS.length)]; screen='tie'; render(); }
  else { winner=tops[0]; trackEvent('result_country',{assigned_country:winner}); trackEvent('oracle_complete',{assigned_country:winner}); screen='result'; render(); }
}
function chooseTie(country){ winner=country; trackEvent('result_country',{assigned_country:winner}); trackEvent('oracle_complete',{assigned_country:winner}); screen='result'; render(); }
function share(){
  trackEvent('share_passport_click',{assigned_country:winner||''});
  const r=RESULTS[winner];
  const msg=`The World Cup Oracle has stamped me: ${r.flag} ${winner} — ${r.persona}. Passport No: ${r.passportCode}`+(dual?` Declared Favourite: ${dual}.`:'.');
  if(navigator.share){ navigator.share({title:'My World Cup Oracle Passport',text:msg}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(msg).then(()=>{copied=true; render();}).catch(()=>{}); }
  else { copied=true; render(); }
}
function renderLanding(){
  root.innerHTML=shell(`<img id="startQuiz" class="hero" src="${esc(ASSETS.hero)}" alt="The World Cup Oracle Passport">`,'landing');
  document.getElementById('startQuiz').addEventListener('click',()=>{trackEvent('oracle_start'); setScreen('question');});
}
function renderQuestion(){
  const qu=questions[idx];

  root.innerHTML=shell(`<div class="progressLabel">PASSPORT APPLICATION ${idx+1}/6</div><div class="progressTrack"><div class="progressFill" style="width:${((idx+1)/6)*100}%"></div></div><div class="questionCard"><div class="ministry">MINISTRY QUESTION</div>${qu.intro?`<div class="questionIntro">${esc(qu.intro)}</div>`:''}<h1 class="questionText">${esc(qu.question||qu.text)}</h1><div class="options">${opts}</div></div>`);
  document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>answer(btn.dataset.country)));
}
function renderCalculating(){
  root.innerHTML=shell(`<div class="spinner"></div><h2>THE MINISTRY IS STAMPING...</h2><p class="small">Do not refresh. Your football soul is under review.</p>`,'calc');
}
function renderTie(){
  const opts=tieQ.options.filter(o=>tied.includes(o.country)).map((o,i)=>`<button class="option" data-country="${esc(o.country)}"><span class="optionLabel">Option ${String.fromCharCode(65+i)}</span><span class="optionText">${esc(o.text)}</span></button>`).join('');
  root.innerHTML=shell(`<div class="questionCard"><div class="ministry">MINISTRY QUESTION</div><div class="tieCopy">Your answers are giving signals that are confusing the Oracle. The Ministry requires one final answer. Choose carefully.</div>${tieQ.intro?`<div class="questionIntro">${esc(tieQ.intro)}</div>`:''}<h1 class="questionText">${esc(tieQ.question||tieQ.text)}</h1><div class="options">${opts}</div></div>`,'tie');
  document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>chooseTie(btn.dataset.country)));
}
function renderResult(){
  const r=RESULTS[winner];
  const dualHtml=dual?`<div class="dualBadge"><div class="dualBadgeTitle">DUAL CITIZENSHIP APPROVED</div><div class="dualBadgeCountry"><span class="dualBadgeFlag">${esc(flagFor(dual))}</span><span class="dualBadgeLabel">Declared Favourite:</span><span class="dualBadgeName">${esc(dual)}</span></div><div class="dualBadgeNote">Your official passport remains unchanged</div></div>`:'';

    actions=`<div class="actions"><button id="acceptBtn" class="btn green">ACCEPT MY PASSPORT</button><button id="appealBtn" class="btn outlineRed">I OBJECT — APPEAL THIS RESULT</button></div>`;

      actions+=`<div class="appealPanel"><p>Your objection has been noted by the Ministry.</p><p>However, the Oracle does not issue refunds. You have two options:</p><div class="ctaPanel"><button id="retakeAppeal" class="btn deep">RETAKE THE TEST</button><button id="dualModeBtn" class="btn green">ACCEPT DUAL CITIZENSHIP INSTEAD</button></div>${dualMode?`<div class="dualBox"><div class="dualLabel">Declare your emotional allegiance (this does not change your Oracle Passport)</div><select id="dualSelect" class="select"><option value="">Choose emotional favourite</option>${ALL_48.map(c=>`<option value="${esc(c)}" ${dual===c?'selected':''}>${esc(flagFor(c))} ${esc(c)}</option>`).join('')}</select></div>`:''}</div>`;
    }
  } else {
    actions=`<div class="ctaPanel"><div class="challengeHelper">Superbru link, prizes, leaderboard and registration are inside.</div><button id="waBtn" class="btn whatsappPrimary">JOIN EMBASSY TO ENTER THE CHALLENGE</button><div class="challengeWarning">No Embassy registration, no prize claim.</div><button id="shareBtn" class="btn shareSecondary">Share Passport</button>${copied?'<div class="copyNote">Share copy copied to clipboard.</div>':''}<button id="retakeBtn" class="textLink">Retake the Test</button></div>`;
  }
  root.innerHTML=shell(`<div class="resultCard"><img class="stamp" src="${esc(r.stampSrc)}" alt="${esc(winner)} passport stamp">${dualHtml}</div>${actions}`);

  const waBtn=document.getElementById('waBtn'); if(waBtn) waBtn.addEventListener('click',()=>{trackEvent('whatsapp_click',{assigned_country:winner||''}); window.open(WHATSAPP_LINKS[winner],'_blank');});

  const retakeBtn=document.getElementById('retakeBtn'); if(retakeBtn) retakeBtn.addEventListener('click',reset);
}
function render(){
  if(screen==='landing') return renderLanding();
  if(screen==='question') return renderQuestion();
  if(screen==='calculating') return renderCalculating();
  if(screen==='tie') return renderTie();
  if(screen==='result') return renderResult();
}
