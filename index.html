<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The World Cup Oracle | Savvy Football</title>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{--green:#7a9904;--deep:#4f7405;--lime:#26d83b;--red:#ed1f26;--ink:#5d5d63;--blue:#7d92cf;--paper:#f4f2f7;--cream:#f5f7e9;--lav:#d9d0ea;--line:#86a20b;--gold:#d7df87;}
    *{box-sizing:border-box} body{margin:0;background:#9d9d9b;color:var(--ink);font-family:Impact,'Arial Narrow','Trebuchet MS',Arial,sans-serif;min-height:100vh} button,input,select{font:inherit}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.phone{position:relative;width:100%;max-width:430px;min-height:760px;background:var(--paper);border-radius:34px;overflow:hidden;box-shadow:0 24px 55px rgba(0,0,0,.18);padding:34px 28px}.blob{position:absolute;background:var(--lav);opacity:.72;border-radius:48% 52% 42% 58%;z-index:0}.b1{width:190px;height:245px;left:-125px;top:245px}.b2{width:150px;height:190px;right:-72px;top:58px}.b3{width:170px;height:125px;right:-18px;bottom:-50px}.content{position:relative;z-index:1}.logo{display:block;margin:8px auto 12px;max-width:150px}.hero{display:block;margin:8px auto 10px;width:88%;max-width:320px}.headline{text-align:center;text-transform:uppercase;font-size:40px;line-height:.96;letter-spacing:.5px;margin:10px 0 14px;color:var(--green)}.headline .blue{color:var(--blue)}.bodycopy{font-family:'Trebuchet MS',Arial,sans-serif;text-align:center;font-weight:800;font-size:15px;line-height:1.42;max-width:330px;margin:0 auto;color:#606066}.pill{font-family:'Trebuchet MS',Arial,sans-serif;margin:34px auto 38px;border:1.8px solid var(--line);border-radius:18px;padding:10px 16px;width:max-content;max-width:100%;font-weight:900;background:#fbfbf6;letter-spacing:.5px}.primary-plane{position:relative;border:0;background:var(--deep);color:white;font-size:22px;border-radius:13px;padding:18px 28px;display:block;margin:0 auto;min-width:270px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.08);cursor:pointer}.primary-plane:after{content:'';position:absolute;right:-38px;top:0;border-top:30px solid transparent;border-bottom:30px solid transparent;border-left:54px solid var(--deep)}.primary-plane:before{content:'';position:absolute;right:12px;top:0;border-top:30px solid rgba(255,255,255,.25);border-bottom:30px solid rgba(255,255,255,.25);border-left:18px solid transparent;z-index:2}.minihead{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}.minihead img{width:105px}.progressText{text-align:center;color:var(--green);font-size:18px;text-transform:uppercase}.progress{height:10px;background:#e2e7c7;border-radius:999px;overflow:hidden;margin:8px 0 26px}.bar{height:100%;background:var(--green);border-radius:999px}.qcard{border:3px solid var(--line);border-radius:28px;padding:24px 18px;background:#fbfbf8}.qeyebrow{text-align:center;color:var(--green);font-size:20px;text-transform:uppercase;margin-bottom:12px}.question{font-size:30px;line-height:1.02;text-align:center;color:#596063;margin:0 0 22px}.answers{display:grid;gap:11px}.answer{border:2px solid #d9dfb8;background:#fff;border-radius:16px;padding:14px 14px;text-align:left;color:#555;font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;line-height:1.25;cursor:pointer}.answer.selected{border-color:var(--green);background:#f2f8d5;box-shadow:inset 0 0 0 2px rgba(122,153,4,.2)}.next{width:100%;border:0;margin-top:18px;background:var(--deep);color:white;border-radius:14px;padding:15px;font-size:21px;cursor:pointer}.next:disabled{opacity:.45}.loading{text-align:center;padding-top:190px}.spinner{width:90px;height:90px;border:8px solid #dfe7bd;border-top-color:var(--green);border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{color:var(--green);font-size:34px;line-height:1;margin:0 0 12px}.loading p{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900}.passport{border:4px solid var(--line);border-radius:28px;padding:0 12px 14px;background:#f8f7fb;overflow:hidden}.passportTop{background:var(--green);color:white;text-align:center;font-size:23px;padding:13px;border-radius:0 0 0 0;margin:0 -12px 16px}.oracle{text-align:center;color:var(--green);font-size:22px;margin:0 0 10px}.claimed{display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px;text-transform:uppercase;line-height:1;color:#666;margin-bottom:12px}.flag{font-size:31px;background:white;border:1px solid #ddd;padding:2px 8px}.stamp{border:6px solid var(--green);color:var(--green);border-radius:18px;padding:16px 14px 12px;transform:rotate(-4deg);margin:10px 12px 26px;box-shadow:0 0 0 3px rgba(122,153,4,.15) inset;background:#f4f7e6;text-align:center;position:relative}.stamp:before,.stamp:after{content:'';position:absolute;left:10px;right:10px;border-top:3px solid var(--green)}.stamp:before{top:40px}.stamp:after{bottom:42px}.stampCountry{font-size:38px;line-height:.9}.stampArch{font-size:19px;margin-top:7px}.stampStatus{font-size:16px;margin-top:18px}.stampNo{font-size:16px;margin-top:6px}.descrow{display:flex;align-items:center;gap:8px;margin:6px 8px 18px}.desc{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;font-size:18px;line-height:1.25;flex:1}.player{width:105px;align-self:flex-start}.dualNote{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;border:2px dashed var(--line);background:#fbfde9;border-radius:14px;padding:9px 10px;text-align:center;margin:0 8px 14px;color:#5b6500}.beef{background:#eef1df;border-radius:0 0 20px 20px;margin:0 4px;padding:0 12px 14px;text-align:center;position:relative}.beefLabel{display:inline-block;background:var(--green);color:white;padding:9px 12px;border-radius:5px;font-size:18px;transform:translateY(-9px);margin-right:8px}.beefTeam{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;font-size:16px}.beefReason{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;font-size:14px;line-height:1.2;margin-top:6px}.actions{margin-top:22px;text-align:center}.actionrow{display:flex;gap:12px;justify-content:center}.btn{border:0;border-radius:8px;padding:14px 16px;color:white;font-size:18px;cursor:pointer}.accept{background:var(--lime);flex:1}.appeal{background:var(--red);flex:1}.linkbtn{border:0;background:transparent;color:var(--green);font-size:18px;text-decoration:underline;margin-top:14px;cursor:pointer}.share{background:var(--green);width:100%;margin-bottom:10px}.embassy{background:#263b08;width:100%;margin-bottom:6px}.smallmsg{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;line-height:1.25;margin:0 0 13px}.modal{position:absolute;inset:0;background:rgba(50,50,50,.45);z-index:5;display:flex;align-items:center;justify-content:center;padding:24px}.modalbox{background:#fbfbf8;border:4px solid var(--line);border-radius:24px;padding:22px;width:100%;text-align:center}.modalbox h3{font-size:29px;color:var(--green);margin:0 0 10px;line-height:1}.modalbox p{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;line-height:1.3}.select{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;margin:10px 0 14px;background:white;color:#555}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#263b08;color:white;padding:12px 18px;border-radius:999px;font-family:'Trebuchet MS',Arial,sans-serif;font-weight:900;z-index:10;max-width:90%;text-align:center}.restart{font-family:'Trebuchet MS',Arial,sans-serif;border:0;background:transparent;color:#777;text-decoration:underline;margin-top:14px;font-weight:900;cursor:pointer}@media(max-width:390px){.phone{min-height:720px;padding:28px 20px}.headline{font-size:34px}.claimed{font-size:25px}.stampCountry{font-size:32px}.desc{font-size:16px}.player{width:86px}.btn{font-size:15px;padding:13px 10px}}
  </style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const APP_CONFIG={appName:'The World Cup Oracle',poweredBy:'Savvy Football',appUrl:'https://YOUR_GITHUB_USERNAME.github.io/world-cup-oracle/',tournamentChallengeLink:'#'};
const ASSETS={logo:'world-cup-oracle-logo.png',hero:'oracle-hero-illustration.png',player:'footballer-brazil.png'};
const WHATSAPP_LINKS={Brazil:'#',Argentina:'#',France:'#',Morocco:'#',England:'#',Germany:'#',Spain:'#',Portugal:'#'};
const WORLD_CUP_TEAMS=[['A','Mexico','🇲🇽'],['A','South Africa','🇿🇦'],['A','Korea Republic','🇰🇷'],['A','Czechia','🇨🇿'],['B','Canada','🇨🇦'],['B','Bosnia and Herzegovina','🇧🇦'],['B','Qatar','🇶🇦'],['B','Switzerland','🇨🇭'],['C','Brazil','🇧🇷'],['C','Morocco','🇲🇦'],['C','Haiti','🇭🇹'],['C','Scotland','🏴'],['D','United States','🇺🇸'],['D','Paraguay','🇵🇾'],['D','Australia','🇦🇺'],['D','Türkiye','🇹🇷'],['E','Germany','🇩🇪'],['E','Curaçao','🇨🇼'],['E',"Côte d'Ivoire",'🇨🇮'],['E','Ecuador','🇪🇨'],['F','Netherlands','🇳🇱'],['F','Japan','🇯🇵'],['F','Sweden','🇸🇪'],['F','Tunisia','🇹🇳'],['G','Belgium','🇧🇪'],['G','Egypt','🇪🇬'],['G','IR Iran','🇮🇷'],['G','New Zealand','🇳🇿'],['H','Spain','🇪🇸'],['H','Cabo Verde','🇨🇻'],['H','Saudi Arabia','🇸🇦'],['H','Uruguay','🇺🇾'],['I','France','🇫🇷'],['I','Senegal','🇸🇳'],['I','Iraq','🇮🇶'],['I','Norway','🇳🇴'],['J','Argentina','🇦🇷'],['J','Algeria','🇩🇿'],['J','Austria','🇦🇹'],['J','Jordan','🇯🇴'],['K','Portugal','🇵🇹'],['K','Congo DR','🇨🇩'],['K','Uzbekistan','🇺🇿'],['K','Colombia','🇨🇴'],['L','England','🏴'],['L','Croatia','🇭🇷'],['L','Ghana','🇬🇭'],['L','Panama','🇵🇦']].map(([group,country,flag])=>({group,country,flag}));
const RESULTS={
 Brazil:{flag:'🇧🇷',archetype:'The Joy Merchant',status:'Stamped for Vibes & Reckless Dribbling',passportNo:'BRA-JOY-2026',description:'The Oracle assigned you to Brazil Embassy because you chose joy, skills, and irresponsible attacking football over blood pressure.',rival:'Germany',rivalFlag:'🇩🇪',beef:'Because somewhere in the family records, 7–1 is still written in red ink.'},
 Argentina:{flag:'🇦🇷',archetype:'The Drama Loyalist',status:'Stamped for Tears, Talent & Last-Minute Prayers',passportNo:'ARG-DRM-2026',description:'The Oracle assigned you to Argentina Embassy because you respect passion, chaos, and football that behaves like a telenovela.',rival:'England',rivalFlag:'🏴',beef:'Because history, handballs, penalties, and premium tournament grudges are never truly dead.'},
 France:{flag:'🇫🇷',archetype:'The Squad Depth Minister',status:'Stamped for Talent Hoarding & Calm Oppression',passportNo:'FRA-DEP-2026',description:'The Oracle assigned you to France Embassy because you like options, pace, power, and having three world-class players for every position.',rival:'Portugal',rivalFlag:'🇵🇹',beef:'Because star power must occasionally fight squad depth for public respect.'},
 Morocco:{flag:'🇲🇦',archetype:'The African Agenda Chief',status:'Stamped for Continental Pride & Defensive Stubbornness',passportNo:'MAR-AFR-2026',description:'The Oracle assigned you to Morocco Embassy because Africa must collect respect, and you are prepared to defend that agenda with your chest.',rival:'Spain',rivalFlag:'🇪🇸',beef:'Because neighbours can smile in public and still drag each other for 120 minutes.'},
 England:{flag:'🏴',archetype:'The EPL Prisoner',status:'Stamped for Hype, Hope & Annual Disappointment',passportNo:'ENG-EPL-2026',description:'The Oracle assigned you to England Embassy because you watch too much Premier League and still believe this year may finally be different.',rival:'Argentina',rivalFlag:'🇦🇷',beef:'Because old football sins have long memories and louder pundits.'},
 Germany:{flag:'🇩🇪',archetype:'The Spreadsheet General',status:'Stamped for Structure, Efficiency & Cold Punishment',passportNo:'GER-ORD-2026',description:'The Oracle assigned you to Germany Embassy because you trust systems, discipline, and teams that treat football like factory settings.',rival:'Brazil',rivalFlag:'🇧🇷',beef:'Because 7–1 is not a scoreline. It is a family trauma.'},
 Spain:{flag:'🇪🇸',archetype:'The Possession Philosopher',status:'Stamped for Passing Triangles & Tactical Sermons',passportNo:'ESP-TIK-2026',description:'The Oracle assigned you to Spain Embassy because you believe the ball should suffer small-small before entering the net.',rival:'Morocco',rivalFlag:'🇲🇦',beef:'Because close neighbours and knockout memories make peaceful football impossible.'},
 Portugal:{flag:'🇵🇹',archetype:'The Star Power Believer',status:'Stamped for Main Character Energy & Clutch Narratives',passportNo:'POR-STAR-2026',description:'The Oracle assigned you to Portugal Embassy because you believe one superstar, one free kick, and one dramatic camera close-up can change destiny.',rival:'France',rivalFlag:'🇫🇷',beef:'Because elegance and superstar stubbornness cannot share the same VIP table.'}
};
const QUESTIONS=[
 {q:'Nigeria did not qualify. What is your official coping strategy?',a:[['Choose joy. I refuse to suffer twice.','Brazil'],['Adopt the strongest African agenda immediately.','Morocco'],['Study the draw like a technical adviser.','Germany'],['Find one superstar and attach my destiny there.','Portugal']]},
 {q:'Your viewing centre loses signal during a big match. What do you do?',a:[['Start shouting but somehow make it entertaining.','Brazil'],['Blame the referee, CAF, FIFA and village people.','Argentina'],['Organise people calmly and find another screen.','Germany'],['Say this is why tactics matter more than vibes.','Spain']]},
 {q:'Pick your football love language.',a:[['Skills, dribbles and irresponsible enjoyment.','Brazil'],['Passion, tears and dramatic redemption.','Argentina'],['Pace, power and too many dangerous players.','France'],['Clean passing until opponents question life.','Spain']]},
 {q:'In the WhatsApp group, what is your role during matches?',a:[['Meme supplier and chief vibes officer.','Brazil'],['Long voice notes after every mistake.','England'],['African pride enforcement officer.','Morocco'],['Cold analyst with receipts and screenshots.','Germany']]},
 {q:'Penalty shootout starts. What is your body doing?',a:[['Laughing loudly to hide fear.','Brazil'],['Praying, bargaining and remembering ancestors.','Argentina'],['Calculating goalkeeper tendencies like a data scientist.','Germany'],['Already preparing excuses in case of nonsense.','England']]},
 {q:'What type of team do you secretly trust?',a:[['The one with outrageous attackers.','France'],['The one with one undeniable main character.','Portugal'],['The one carrying continental pride.','Morocco'],['The one that controls the ball and your blood pressure.','Spain']]},
 {q:'Your adopted country loses. What is your first statement?',a:[['At least we entertained the world.','Brazil'],['Football is pain. I will be back tomorrow.','Argentina'],['The system failed only in small details.','Germany'],['The media pressure was too much, please.','England']]},
 {q:'Choose your World Cup prophecy style.',a:[['Vibes will carry us to places tactics cannot explain.','Brazil'],['Suffering first, glory later. That is football heritage.','Argentina'],['Africa is not going there to clap for anybody.','Morocco'],['Big players decide big tournaments. Simple.','Portugal']]}
];
function App(){const [screen,setScreen]=React.useState('home'),[i,setI]=React.useState(0),[answers,setAnswers]=React.useState([]),[selected,setSelected]=React.useState(null),[result,setResult]=React.useState(null),[state,setState]=React.useState('fresh'),[modal,setModal]=React.useState(null),[side,setSide]=React.useState(''),[toast,setToast]=React.useState('');
 const pick=(country)=>setSelected(country); const next=()=>{const na=[...answers,selected];setAnswers(na);setSelected(null); if(i<QUESTIONS.length-1)setI(i+1);else{setScreen('loading');setTimeout(()=>{const r=calc(na);setResult(r);setScreen('result')},1400)}};
 const calc=(arr)=>{const scores={Brazil:0,Argentina:0,France:0,Morocco:0,England:0,Germany:0,Spain:0,Portugal:0};arr.forEach(c=>scores[c]++);return Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||a.localeCompare(b))[0]};
 const restart=()=>{setScreen('quiz');setI(0);setAnswers([]);setSelected(null);setState('fresh');setModal(null);setSide('')};
 const showToast=t=>{setToast(t);setTimeout(()=>setToast(''),2500)};
 const share=async()=>{const r=RESULTS[result];const sideText=side?`\nEmotional attachment: ${side}. The Ministry has noted my divided loyalty.`:'';const text=`The World Cup Oracle assigned me to ${result} Embassy ${r.flag}\nFan type: ${r.archetype}\n${r.description}${sideText}\n\nTake your own test: ${APP_CONFIG.appUrl}`;try{if(navigator.share){await navigator.share({title:'My World Cup Oracle Passport',text,url:APP_CONFIG.appUrl});}else{await navigator.clipboard.writeText(text);showToast('Result copied. Paste it in WhatsApp, X, Instagram or the group chat.')}}catch(e){showToast('Share cancelled. Screenshot evidence is still allowed.')}};
 const openLink=url=>{if(url==='#')showToast('Placeholder link. Add the real campaign URL in the code.');else window.open(url,'_blank')};
 return <div className="app"><div className="phone"><div className="blob b1"></div><div className="blob b2"></div><div className="blob b3"></div>{screen==='home'&&<Home start={()=>setScreen('quiz')}/>} {screen==='quiz'&&<Quiz i={i} selected={selected} pick={pick} next={next}/>} {screen==='loading'&&<Loading/>} {screen==='result'&&result&&<Result result={result} state={state} setState={setState} restart={restart} setModal={setModal} side={side} share={share} openLink={openLink}/>} {modal==='dual'&&<Dual result={result} setModal={setModal} setSide={setSide} setState={setState}/>} {toast&&<div className="toast">{toast}</div>}</div></div>}
function Home({start}){return <div className="content"><img className="logo" src={ASSETS.logo}/><img className="hero" src={ASSETS.hero}/><h1 className="headline">Nigeria<br/>Didn't Qualify.<br/><span className="blue">Your Loyalty Is<br/>Now Available<br/>For Transfer.</span></h1><p className="bodycopy">Since the Super Eagles have kuku chosen to embarrass us, the Ministry of Football Vibes has now opened emergency passport applications. Your temporary World Cup country will now be assigned. Don't argue.</p><div className="pill">8 Questions &nbsp;✶&nbsp; 1 Country &nbsp;✶&nbsp; 1 Passport</div><button className="primary-plane" onClick={start}>Assign My Passport</button></div>}
function Quiz({i,selected,pick,next}){const q=QUESTIONS[i];return <div className="content"><div className="minihead"><img src={ASSETS.logo}/></div><div className="progressText">Passport Application {i+1}/8</div><div className="progress"><div className="bar" style={{width:`${((i+1)/8)*100}%`}}></div></div><div className="qcard"><div className="qeyebrow">Ministry Question</div><h2 className="question">{q.q}</h2><div className="answers">{q.a.map(([text,c])=><button key={text} className={'answer '+(selected===c?'selected':'')} onClick={()=>pick(c)}>{text}</button>)}</div><button className="next" disabled={!selected} onClick={next}>{i===7?'Submit To Oracle':'Next Question'}</button></div></div>}
function Loading(){return <div className="content loading"><div className="spinner"></div><h2>The Oracle is reviewing your file...</h2><p>Checking group chat behaviour. Consulting VAR spiritually. Ignoring objections.</p></div>}
function Result({result,state,setState,restart,setModal,side,share,openLink}){const r=RESULTS[result];return <div className="content"><div className="passport"><div className="passportTop">Emergency Football Passport</div><div className="oracle">THE ORACLE HAS SPOKEN...</div><div className="claimed"><span className="flag">{r.flag}</span><span>{result} Has Claimed You</span></div><div className="stamp"><div className="stampCountry">{result.toUpperCase()}</div><div className="stampArch">{r.archetype}</div><div className="stampStatus">Passport status:<br/><b>{r.status}</b></div><div className="stampNo">Passport No.:<br/><b>{r.passportNo}</b></div></div><div className="descrow"><div className="desc">{r.description}</div><img className="player" src={ASSETS.player}/></div>{side&&<div className="dualNote">Emotional Attachment: {side}<br/>Official passport remains {result}.</div>}<div className="beef"><span className="beefLabel">Embassy Beef:</span><span className="beefTeam">{r.rival} {r.rivalFlag}</span><div className="beefReason">{r.beef}</div></div></div><div className="actions">{state==='fresh'&&<><div className="actionrow"><button className="btn accept" onClick={()=>setState('accepted')}>✓ Accept Passport</button><button className="btn appeal" onClick={()=>setState('appeal')}>✕ Appeal Result</button></div><button className="linkbtn" onClick={()=>setModal('dual')}>↔ Add dual citizenship</button></>}{state==='accepted'&&<><p className="smallmsg"><b>Passport stamped.</b><br/>Screenshot this passport. Evidence may be required in the group chat.</p><button className="btn share" onClick={share}>Share My Passport</button><button className="btn embassy" onClick={()=>openLink(WHATSAPP_LINKS[result])}>Join My Embassy</button><button className="linkbtn" onClick={()=>openLink(APP_CONFIG.tournamentChallengeLink)}>Join Tournament Challenge</button></>}{state==='appeal'&&<><p className="smallmsg"><b>Appeal filed.</b><br/>The Ministry will reopen your case. Suspicious answer changes may be used against you.</p><div className="actionrow"><button className="btn accept" onClick={restart}>Retake Test</button><button className="btn appeal" onClick={()=>setState('fresh')}>Keep Passport</button></div></>}</div></div>}
function Dual({result,setModal,setSide,setState}){const [v,setV]=React.useState('');return <div className="modal"><div className="modalbox"><h3>Declare Your Emotional Attachment</h3><p>Your Oracle passport remains official. But if your heart already belongs to another country, the Ministry will note it for emotional reasons.</p><select className="select" value={v} onChange={e=>setV(e.target.value)}><option value="">Select your side country</option>{WORLD_CUP_TEAMS.map(t=><option key={t.country} value={`${t.flag} ${t.country}`}>Group {t.group} — {t.flag} {t.country}</option>)}</select><button className="btn accept" style={{width:'100%'}} disabled={!v} onClick={()=>{setSide(v);setState('accepted');setModal(null)}}>Note My Side Country</button><button className="linkbtn" onClick={()=>setModal(null)}>Cancel</button></div></div>}
ReactDOM.render(<App/>,document.getElementById('root'));
</script></body></html>
